# Deploys to test on every push to main and to demo when a
# release is published. The deploy step is a stub until workforce-infra
# provides the environment accounts and the GitHub OIDC roles.
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${GITHUB_SHA::7} to test"

  demo:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${{ github.event.release.tag_name }} to demo"
