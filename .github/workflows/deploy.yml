# Deploys to development on every push to main and to production when a
# release is published. The deploy step is a stub until workforce-infra
# provides the environment accounts and the GitHub OIDC roles.
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  development:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${GITHUB_SHA::7} to development"

  production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${{ github.event.release.tag_name }} to production"
