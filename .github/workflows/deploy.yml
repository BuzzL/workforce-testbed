# Deploys to test for every pull request, to qa on every push to main and
# to demo when a v* tag is pushed. The release/* branches (the real
# production release) are manual and deliberately not handled here. The
# deploy step is a stub until workforce-infra provides the environment
# accounts and the GitHub OIDC roles.
name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${GITHUB_SHA::7} to test"

  qa:
    if: github.ref_type == 'branch' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${GITHUB_SHA::7} to qa"

  demo:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy (stub)
        run: echo "Would deploy ${GITHUB_REF_NAME} to demo"
